name: Release Desktop

on:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '22'

jobs:
  build-and-upload:
    runs-on: windows-latest
    name: Build Windows Installer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        working-directory: ./desktop
        run: npm ci

      - name: Prepare static export (remove API routes entirely)
        shell: bash
        run: |
          mkdir -p .static-export-backup
          if [ -d "src/app/api" ]; then
            cp -r src/app/api .static-export-backup/api
            rm -rf src/app/api
            echo "? src/app/api supprimé pour le build statique"
          fi
          if [ -d "src/lib/actions" ]; then
            cp -r src/lib/actions .static-export-backup/actions
            rm -rf src/lib/actions
            echo "? src/lib/actions supprimé pour le build statique"
          fi
          if [ -d "src/app/admin" ]; then
            cp -r src/app/admin .static-export-backup/admin
            rm -rf src/app/admin
            echo "? src/app/admin supprimé pour le build statique"
          fi
          if [ -d "src/app/(public)" ]; then
            cp -r "src/app/(public)" ".static-export-backup/public"
            rm -rf "src/app/(public)"
            echo "? src/app/(public) supprimé pour le build statique"
          fi
          if [ -d "src/app/client/dashboard" ]; then
            cp -r src/app/client/dashboard .static-export-backup/dashboard
            rm -rf src/app/client/dashboard
            echo "? src/app/client/dashboard supprimé pour le build statique"
          fi
          echo "=== Contenu de src/app après suppression ==="
          ls src/app
          echo "=== Contenu de src/lib après suppression ==="
          ls src/lib
          if [ -d "src/app/api" ]; then
            echo "ERREUR: src/app/api n'a pas pu être supprimé"
            exit 1
          fi

      - name: Build Next.js app (static export)
        env:
          BUILD_TARGET: 'desktop'
          NEXT_EXPORT: 'true'
          BETTER_AUTH_SECRET: 'static-build-dummy-secret-min-32-chars-long'
        run: npm run build

      - name: Restore sources (always)
        if: always()
        shell: bash
        run: |
          if [ -d ".static-export-backup/api" ]; then
            cp -r .static-export-backup/api src/app/api
          fi
          if [ -d ".static-export-backup/actions" ]; then
            cp -r .static-export-backup/actions src/lib/actions
          fi
          if [ -d ".static-export-backup/admin" ]; then
            cp -r .static-export-backup/admin src/app/admin
          fi
          if [ -d ".static-export-backup/public" ]; then
            cp -r ".static-export-backup/public" "src/app/(public)"
          fi
          if [ -d ".static-export-backup/dashboard" ]; then
            mkdir -p src/app/client
            cp -r .static-export-backup/dashboard src/app/client/dashboard
          fi
          rm -rf .static-export-backup

      - name: Build desktop app with Tauri
        working-directory: ./desktop/src-tauri
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Publish installers to Vercel Blob
        shell: bash
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          RELEASE_API_SECRET: ${{ secrets.RELEASE_API_SECRET }}
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"

          target_os="windows"

          node scripts/publish-desktop.mjs \
            ./desktop/src-tauri/target/release/bundle \
            "$version" \
            "$target_os" \
            "${{ secrets.NEXT_PUBLIC_APP_URL }}" \
            "$RELEASE_API_SECRET"
