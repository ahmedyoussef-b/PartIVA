name: Release Desktop

on:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '22'

jobs:
  build-and-upload:
    runs-on: windows-latest
    name: Build Windows Installer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        working-directory: ./desktop
        run: npm ci

      - name: Temporarily disable API routes, admin, materiaux, reverse-engineering, lib/actions and other dynamic pages for static export
        shell: bash
        run: |
          mkdir -p .static-export-backup
          for dir in src/app/api src/app/admin src/app/(public)/materiaux src/app/(public) src/app/client/dashboard src/lib/actions; do
            if [ -d "$dir" ]; then
              base=$(basename "$dir")
              mv "$dir" ".static-export-backup/$base" 2>/dev/null || true
            fi
          done
          echo "=== Contenu de src/app après déplacement ==="
          ls src/app
          if [ -d "src/app/api" ] || [ -d "src/app/admin" ] || [ -d "src/app/(public)" ] || [ -d "src/app/client/dashboard" ] || [ -d "src/lib/actions" ]; then
            echo "ERREUR: un dossier n'a pas pu être déplacé"
            exit 1
          fi

      - name: Build Next.js app (static export)
        env:
          NEXT_EXPORT: 'true'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'static-build-dummy-secret-min-32-chars-long' }}
        run: npm run build

      - name: Restore API routes, admin, materiaux, reverse-engineering, lib/actions and other dynamic pages
        if: always()
        shell: bash
        run: |
          if [ -d ".static-export-backup/api" ]; then
            mv .static-export-backup/api src/app/api
          fi
          if [ -d ".static-export-backup/admin" ]; then
            mv .static-export-backup/admin src/app/admin
          fi
          if [ -d ".static-export-backup/(public)" ]; then
            mv ".static-export-backup/(public)" "src/app/(public)"
          fi
          if [ -d ".static-export-backup/client" ]; then
            mkdir -p src/app/client
            mv .static-export-backup/client/dashboard src/app/client/dashboard 2>/dev/null || true
          fi
          if [ -d ".static-export-backup/lib-actions" ]; then
            mv .static-export-backup/lib-actions src/lib/actions
          fi

      - name: Build desktop app with Tauri
        working-directory: ./desktop/src-tauri
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Publish installers to Vercel Blob
        shell: bash
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          RELEASE_API_SECRET: ${{ secrets.RELEASE_API_SECRET }}
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"

          target_os="windows"

          node scripts/publish-desktop.mjs \
            ./desktop/src-tauri/target/release/bundle \
            "$version" \
            "$target_os" \
            "${{ secrets.NEXT_PUBLIC_APP_URL }}" \
            "$RELEASE_API_SECRET"
